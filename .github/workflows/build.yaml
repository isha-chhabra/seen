# Host-side checks: format and lint, type check, unit tests, and a real build.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Formatting, lint and import order in one pass, repo-wide. Runs first
      # because it is the cheapest thing that can fail.
      - name: Format and lint
        run: pnpm lint

      # Redundant with `pnpm build` (turbo's build depends on check-types), but
      # it fails in a minute instead of after the whole build, and turbo caches
      # the result so the build step doesn't repeat it.
      - name: Type check
        run: pnpm turbo check-types

      - name: Unit tests
        run: pnpm turbo test

      - name: Build
        run: pnpm build
