services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Images are built in CI (.github/workflows/build-images.yml) and pushed to GHCR.
  # This box only pulls + runs them. To update: push to main, wait for the
  # build-images workflow, then `docker compose pull && docker compose up -d`.

  migrate:
    image: ghcr.io/isha-chhabra/seen-migrate:main
    environment:
      DATABASE_URL: postgres://seen:${POSTGRES_PASSWORD}@postgres:5432/seen
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/isha-chhabra/seen-web:main
    restart: unless-stopped
    ports:
      - "1515:3000"
    environment:
      DATABASE_URL: postgres://seen:${POSTGRES_PASSWORD}@postgres:5432/seen
      DEPLOYMENT_MODE: cloud
      # Cloud mode without Stripe: no paywall, unlimited entitlements
      DISABLE_BILLING: "true"
      # LLM key for onboarding auto-suggest + Opportunities (gpt-5-mini, cheapest effective)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional: reliable/fast website fetch for brand analysis (free key at jina.ai)
      JINA_API_KEY: ${JINA_API_KEY:-}
      # Invite-only self-serve signup. Comma-separated exact addresses and/or
      # "@domain" entries. Empty = nobody can register. "*" = fully public (don't).
      CLOUD_SIGNUP_ALLOWLIST: ${CLOUD_SIGNUP_ALLOWLIST:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_NAME: ${APP_NAME}
      APP_ICON: ${APP_ICON}
      APP_URL: ${APP_URL}
      BRIGHTDATA_API_TOKEN: ${BRIGHTDATA_API_TOKEN}
      SCRAPE_TARGETS: ${SCRAPE_TARGETS}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/isha-chhabra/seen-worker:main
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://seen:${POSTGRES_PASSWORD}@postgres:5432/seen
      DEPLOYMENT_MODE: cloud
      DISABLE_BILLING: "true"
      # LLM key for onboarding auto-suggest + Opportunities (gpt-5-mini, cheapest effective)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional: reliable/fast website fetch for brand analysis (free key at jina.ai)
      JINA_API_KEY: ${JINA_API_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      APP_NAME: ${APP_NAME}
      APP_URL: ${APP_URL}
      BRIGHTDATA_API_TOKEN: ${BRIGHTDATA_API_TOKEN}
      SCRAPE_TARGETS: ${SCRAPE_TARGETS}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: seen_pgdata
